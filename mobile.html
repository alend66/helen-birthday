<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile Phone Preview — Helen's Birthday Ride</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #18191f;
    font-family: 'DM Sans', -apple-system, sans-serif;
    color: #f1f2f6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
    overflow-x: hidden;
  }
  .controls-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 900px;
    margin-bottom: 24px;
    background: #232530;
    padding: 12px 20px;
    border-radius: 14px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .preview-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 1.05rem;
    color: #ffbe76;
  }
  .device-toggles {
    display: flex;
    gap: 8px;
    background: #14151b;
    padding: 4px;
    border-radius: 10px;
  }
  .device-btn {
    background: transparent;
    border: none;
    color: #a4b0be;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.82rem;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.25s;
  }
  .device-btn.active, .device-btn:hover {
    background: #ffbe76;
    color: #1e272e;
  }
  .view-direct-btn {
    color: #ffbe76;
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 700;
    padding: 8px 16px;
    border: 1px solid #ffbe76;
    border-radius: 8px;
    transition: 0.25s;
  }
  .view-direct-btn:hover {
    background: #ffbe76;
    color: #1e272e;
  }

  /* Phone Case Simulation */
  .phone-case {
    width: 390px;
    height: 844px;
    background: #000;
    border-radius: 54px;
    padding: 12px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.6), 0 0 0 3px #3d3e48, 0 0 0 8px #22232a;
    position: relative;
    transition: width 0.3s ease, height 0.3s ease;
  }

  /* Dynamic Island / Speaker Notch */
  .phone-notch {
    position: absolute;
    top: 22px;
    left: 50%;
    transform: translateX(-50%);
    width: 116px;
    height: 28px;
    background: #000;
    border-radius: 20px;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.6);
  }
  .camera-lens {
    width: 10px;
    height: 10px;
    background: #111a30;
    border-radius: 50%;
    border: 1px solid #2f3542;
  }

  /* Screen Display */
  .phone-screen {
    width: 100%;
    height: 100%;
    border-radius: 44px;
    overflow: hidden;
    background: #fbf3e2;
    position: relative;
  }
  .phone-screen iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
</style>
</head>
<body>

  <!-- Controls Bar -->
  <div class="controls-bar">
    <div class="preview-brand">
      <span>📱 Mobile View Simulator</span>
      <span style="font-weight:400; font-size:0.85rem; color:#ced6e0;">(Helen's Birthday Tour)</span>
    </div>

    <div class="device-toggles">
      <button class="device-btn active" onclick="setDevice(390, 844, this)">iPhone 15 (390px)</button>
      <button class="device-btn" onclick="setDevice(412, 915, this)">Pixel 7 (412px)</button>
      <button class="device-btn" onclick="setDevice(360, 780, this)">Galaxy S23 (360px)</button>
    </div>

    <a href="index.html" class="view-direct-btn">Full Page ↗</a>
  </div>

  <!-- Simulated Phone Frame -->
  <div class="phone-case" id="phoneCase">
    <div class="phone-notch">
      <div class="camera-lens"></div>
    </div>
    <div class="phone-screen">
      <iframe id="previewFrame" src="index.html"></iframe>
    </div>
  </div>

  <script>
    function setDevice(w, h, btn) {
      const phone = document.getElementById('phoneCase');
      phone.style.width = w + 'px';
      phone.style.height = h + 'px';
      document.querySelectorAll('.device-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
  </script>
</body>
</html>
